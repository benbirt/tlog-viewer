# Weekly version updates, one pull request per ecosystem.
# dependabot-auto-merge.yaml merges them once CI passes.
#
# Not covered here: the google-tlog-witness commit, .bazelversion and the Bazel
# modules (Dependabot cannot evaluate a MODULE.bazel that uses rules_js), which
# update-pins.yaml advances, and the Node version in MODULE.bazel, which
# nothing does (it has to be one that the pinned rules_nodejs knows).
version: 2
updates:
  # package.json and pnpm-lock.yaml: TypeScript and Node's types.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
