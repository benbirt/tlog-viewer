# Weekly version updates, one pull request per ecosystem.
# dependabot-auto-merge.yaml merges them once CI passes.
#
# Not covered here: the google-tlog-witness commit, .bazelversion, the Bazel
# modules (Dependabot cannot evaluate a MODULE.bazel that uses rules_js), the
# Node version and the rules_tinygo commit, all of which update-pins.yaml advances.
version: 2
updates:
  # package.json and pnpm-lock.yaml: TypeScript and Node's types.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node's types follow the Node in MODULE.bazel, whose major version is
      # moved by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]

  # go.mod: the Go implementations the page verifies with (//verifier).
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
